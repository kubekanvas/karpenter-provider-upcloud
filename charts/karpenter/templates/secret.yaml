{{- if not .Values.credentials.existingSecret }}
{{- if and (not .Values.credentials.token) (not (and .Values.credentials.username .Values.credentials.password)) }}
{{- fail "Set credentials.existingSecret, or credentials.token, or both credentials.username and credentials.password" }}
{{- end }}
{{- if and .Values.credentials.token (or .Values.credentials.username .Values.credentials.password) }}
{{- fail "Set either credentials.token or credentials.username/password, not both" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "karpenter.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.credentials.token }}
  UPCLOUD_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.username }}
  UPCLOUD_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.password }}
  UPCLOUD_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
