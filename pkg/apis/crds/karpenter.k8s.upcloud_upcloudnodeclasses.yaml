---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: upcloudnodeclasses.karpenter.k8s.upcloud
spec:
  group: karpenter.k8s.upcloud
  names:
    categories:
    - karpenter
    kind: UpCloudNodeClass
    listKind: UpCloudNodeClassList
    plural: upcloudnodeclasses
    shortNames:
    - ucnc
    - ucncs
    singular: upcloudnodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.zones
      name: Zones
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UpCloudNodeClass is the Schema for the UpCloudNodeClass API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              UpCloudNodeClassSpec is the top level specification for the UpCloud Karpenter provider. It holds
              everything Karpenter needs to turn a NodeClaim into an UpCloud cloud server.
            properties:
              firewall:
                description: |-
                  firewall enables the UpCloud network firewall on the server. Defaults to false, since the
                  firewall's default policy would otherwise have to be managed outside of this NodeClass.
                type: boolean
              hostnamePrefix:
                description: |-
                  hostnamePrefix is prepended to the generated hostname of every server. UpCloud hostnames are
                  limited to 128 characters and the generated suffix takes 40 of them.
                maxLength: 64
                type: string
              kubelet:
                description: |-
                  kubelet defines args used when configuring kubelet on provisioned nodes. They are a subset of
                  the upstream types, recognizing not all options may be supported. Karpenter only uses these
                  to compute allocatable capacity; applying them to the node itself is the responsibility of
                  the bootstrap script in userData.
                properties:
                  clusterDNS:
                    description: clusterDNS is a list of IP addresses for the cluster
                      DNS server.
                    items:
                      type: string
                    type: array
                  cpuCFSQuota:
                    description: cpuCFSQuota enables CPU CFS quota enforcement for
                      containers that specify CPU limits.
                    type: boolean
                  evictionHard:
                    additionalProperties:
                      type: string
                    description: evictionHard is the map of signal names to quantities
                      that define hard eviction thresholds.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for evictionHard are ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available']
                      rule: self.all(x, x in ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available'])
                  evictionMaxPodGracePeriod:
                    description: |-
                      evictionMaxPodGracePeriod is the maximum allowed grace period (in seconds) to use when
                      terminating pods in response to soft eviction thresholds being met.
                    format: int32
                    type: integer
                  evictionSoft:
                    additionalProperties:
                      type: string
                    description: evictionSoft is the map of signal names to quantities
                      that define soft eviction thresholds.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for evictionSoft are ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available']
                      rule: self.all(x, x in ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available'])
                  evictionSoftGracePeriod:
                    additionalProperties:
                      type: string
                    description: |-
                      evictionSoftGracePeriod is the map of signal names to quantities that define grace periods for
                      each eviction signal.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for evictionSoftGracePeriod are ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available']
                      rule: self.all(x, x in ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available'])
                  kubeReserved:
                    additionalProperties:
                      type: string
                    description: kubeReserved contains resources reserved for Kubernetes
                      system components.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for kubeReserved are ['cpu','memory','ephemeral-storage','pid']
                      rule: self.all(x, x=='cpu' || x=='memory' || x=='ephemeral-storage'
                        || x=='pid')
                    - message: kubeReserved value cannot be a negative resource quantity
                      rule: self.all(x, !self[x].startsWith('-'))
                  maxPods:
                    description: maxPods is an override for the maximum number of
                      pods that can run on a worker node instance.
                    format: int32
                    minimum: 0
                    type: integer
                  podsPerCore:
                    description: |-
                      podsPerCore is an override for the number of pods that can run on a worker node instance based
                      on the number of cpu cores. This value cannot exceed maxPods, so, if maxPods is a lower value,
                      that value will be used.
                    format: int32
                    minimum: 0
                    type: integer
                  systemReserved:
                    additionalProperties:
                      type: string
                    description: systemReserved contains resources reserved for OS
                      system daemons and kernel memory.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for systemReserved are ['cpu','memory','ephemeral-storage','pid']
                      rule: self.all(x, x=='cpu' || x=='memory' || x=='ephemeral-storage'
                        || x=='pid')
                    - message: systemReserved value cannot be a negative resource
                        quantity
                      rule: self.all(x, !self[x].startsWith('-'))
                type: object
                x-kubernetes-validations:
                - message: evictionSoft OwnerKey does not have a matching evictionSoftGracePeriod
                  rule: has(self.evictionSoft) ? self.evictionSoft.all(e, (e in self.evictionSoftGracePeriod)):true
                - message: evictionSoftGracePeriod OwnerKey does not have a matching
                    evictionSoft
                  rule: has(self.evictionSoftGracePeriod) ? self.evictionSoftGracePeriod.all(e,
                    (e in self.evictionSoft)):true
              labels:
                additionalProperties:
                  type: string
                description: |-
                  labels are additional UpCloud labels applied to every server. Keys must be 2-32 printable
                  ASCII characters and must not collide with the keys Karpenter manages.
                type: object
              loginUser:
                description: |-
                  loginUser configures the initial account created on the server. SSH keys are strongly
                  preferred over passwords; UpCloud requires at least one of the two for most templates.
                properties:
                  sshKeys:
                    description: sshKeys are the public keys authorized for the login
                      user.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  username:
                    description: username of the account to create. Defaults to the
                      template's default user.
                    type: string
                type: object
              metadata:
                description: |-
                  metadata controls the UpCloud metadata service, which is what serves cloud-init user data.
                  It is forced on whenever userData is set, because cloud-init cannot read it otherwise.
                type: boolean
              network:
                description: |-
                  network describes the interfaces attached to the server, in order. When empty a single
                  public IPv4 interface plus the utility network interface are attached, which matches the
                  UpCloud console default.
                properties:
                  interfaces:
                    description: |-
                      interfaces attached to the server, in the order given. Exactly one interface should carry the
                      address the kubelet registers with; on UpCloud that is conventionally the utility or an SDN
                      interface, since the cloud-controller-manager requires a private address on every node.
                    items:
                      description: NetworkInterface is a single network interface
                        on a provisioned server.
                      properties:
                        ipFamilies:
                          description: |-
                            ipFamilies requested on the interface. Public interfaces default to IPv4 only; utility and
                            private interfaces are always IPv4.
                          items:
                            enum:
                            - IPv4
                            - IPv6
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        network:
                          description: |-
                            network is the UUID of the SDN private network to attach to. Required for private
                            interfaces and ignored otherwise.
                          type: string
                        sourceIPFiltering:
                          description: sourceIPFiltering drops traffic whose source
                            address is not assigned to the interface.
                          type: boolean
                        type:
                          description: type of the interface.
                          enum:
                          - public
                          - utility
                          - private
                          type: string
                      required:
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              serverGroup:
                description: |-
                  serverGroup is the UUID of an UpCloud server group to place servers in. Use a group with an
                  anti-affinity policy to spread nodes across UpCloud hosts.
                type: string
              simpleBackup:
                description: |-
                  simpleBackup enables UpCloud simple backups on the root disk, e.g. "0100,daily". Node disks
                  are usually disposable, so this is off by default.
                type: string
              storage:
                description: storage configures the root disk cloned onto every server
                  from a public or private template.
                properties:
                  encrypted:
                    description: encrypted enables at-rest encryption on the root
                      disk.
                    type: boolean
                  size:
                    description: |-
                      size is the root disk size in gigabytes. It must be at least as large as the template and no
                      larger than the plan allows. When unset, the plan's included storage size is used.
                    maximum: 4096
                    minimum: 10
                    type: integer
                  template:
                    description: |-
                      template is the UUID of the storage template to clone, e.g. the public Ubuntu 24.04 template.
                      Public template UUIDs are stable and listed by `upctl storage list --public --template`.
                    minLength: 1
                    type: string
                  tier:
                    description: tier is the storage tier of the root disk.
                    enum:
                    - maxiops
                    - standard
                    - hdd
                    type: string
                required:
                - template
                type: object
              timeZone:
                description: timeZone is the server's hardware clock timezone, e.g.
                  "UTC".
                type: string
              userData:
                description: |-
                  userData is cloud-init user data made available to the server through the UpCloud metadata
                  service. This is where the node is joined to the cluster: without it a server boots but never
                  registers, and Karpenter will garbage collect it after the registration TTL.
                type: string
              zones:
                description: |-
                  zones restricts the UpCloud zones that servers may be launched into, e.g. ["fi-hel1", "de-fra1"].
                  When empty, the zone the Karpenter controller was configured with is the only candidate.
                  UpCloud has no region concept above the zone, so a NodePool spanning zones spans datacenters.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - storage
            type: object
          status:
            description: UpCloudNodeClassStatus contains the resolved state of the
              UpCloudNodeClass.
            properties:
              conditions:
                description: conditions contains signals for health and readiness.
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              storageTemplate:
                description: storageTemplate contains the resolved root disk template.
                properties:
                  size:
                    description: size is the template's own size in gigabytes. A root
                      disk can never be smaller than this.
                    type: integer
                  title:
                    description: title of the template as reported by UpCloud.
                    type: string
                  uuid:
                    description: uuid of the template.
                    type: string
                required:
                - uuid
                type: object
              zones:
                description: |-
                  zones contains the zones resolved from spec.zones that are known to UpCloud and available to
                  this account. Offerings are only created for these zones.
                items:
                  description: Zone is a resolved UpCloud zone that servers may be
                    launched into.
                  properties:
                    description:
                      description: 'description of the zone as reported by UpCloud,
                        e.g. "Helsinki #1".'
                      type: string
                    id:
                      description: id of the zone, e.g. "fi-hel1".
                      type: string
                  required:
                  - id
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
