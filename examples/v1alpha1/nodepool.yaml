apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.upcloud
        kind: UpCloudNodeClass
        name: default
      requirements:
        # UpCloud sells no interruptible capacity, so on-demand is the only capacity type.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Narrow the plan catalogue rather than listing plan names, so new UpCloud plans are picked
        # up automatically.
        - key: karpenter.k8s.upcloud/instance-family
          operator: In
          values: ["general", "hicpu", "himem"]
        - key: karpenter.k8s.upcloud/instance-cpu
          operator: In
          values: ["2", "4", "8", "16"]
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits:
    cpu: "100"
    memory: 400Gi
